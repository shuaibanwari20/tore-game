# Tore (توره) — Cloudflare Workers + Durable Objects
# Phase 2: go-live via Workers Builds (Git-connected). Deploy steps
# live in README-fa.md.
#
# Deploys run through the Cloudflare dashboard → Workers & Pages →
# Create → Connect to Git → repo "tore-game", ROOT DIRECTORY
# "cloudflare/" (this folder), build command `npm run build` (a
# no-op), deploy command `npx wrangler deploy`. Every push to main
# redeploys automatically.
#
# There is NO KV namespace: the Worker serves the game client by
# fetching the committed cloudflare/dist-client.html from this repo's
# own GitHub raw URL and caching it at the edge — see src/worker.js.
name = "tore-game"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# ONE GameServer object ("global") holds every room.
[[durable_objects.bindings]]
name = "GAME"
class_name = "GameServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameServer"]

[vars]
# "1" turns the Gmail/Facebook sign-in gate ON (see README-fa.md).
# Leave "0" for open play / local testing. Provider secrets
# (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, FB_APP_ID, FB_APP_SECRET,
# SESSION_SECRET) are NOT vars — they go in .dev.vars locally and in
# `wrangler secret put` in production.
AUTH_ENABLED = "0"
